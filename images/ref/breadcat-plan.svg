  </g>
  <g font-size="15" fill="#3A3346">
    <circle cx="30" cy="470" r="8" fill="#B0302A"/><text x="46" y="475">빨간 점: 똑딱이 한 쌍 — 본체 안쪽 위 모서리 ↔ 안주머니 아래 모서리</text>
    <circle cx="30" cy="500" r="8" fill="#1D1A24"/><text x="46" y="505">검은 점: 똑딱이 한 쌍 — 본체 바깥쪽 가운데(접는 자리) 양쪽</text>
    <line x1="20" y1="530" x2="42" y2="530" stroke="#8E8698" stroke-width="2" stroke-dasharray="6 4"/><text x="50" y="535">점선: 접는 선 · 받은 구성도를 그대로 옮겨 그렸어요 (크기 비율은 그림 기준)</text>
  </g>
